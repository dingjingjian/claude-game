<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <title id="page-title">中国铁路 - 火车挂机游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            border: 3px solid #16213e;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            touch-action: none;
        }
        #game-container canvas {
            touch-action: none;
            display: block;
        }
        @media (orientation: portrait) {
            #rotate-hint {
                display: flex;
            }
        }
        @media (orientation: landscape) {
            #rotate-hint {
                display: none;
            }
        }
        #rotate-hint {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 26, 46, 0.95);
            color: #ffffff;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 9999;
            flex-direction: column;
            gap: 16px;
        }
        #rotate-hint .icon {
            font-size: 48px;
            animation: rotate-phone 2s ease-in-out infinite;
        }
        @keyframes rotate-phone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <div id="rotate-hint">
        <span class="icon">📱</span>
        <span id="rotate-text">请旋转手机至横屏模式</span>
    </div>
    <div id="game-container"></div>

    <script src="node_modules/phaser/dist/phaser.min.js"></script>
    <script src="src/utils/lang.js"></script>
    <script src="src/utils/GameData.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/game.js"></script>
</body>
</html>
